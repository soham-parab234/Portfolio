<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Certificate Details - Schematic</title>
  <link rel="icon" id="siteFavicon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230F86A1'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23EBC7B5'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .cert-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: var(--bg);
      color: var(--col-b);
    }
    .cert-topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(27, 27, 27, 0.08);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
    }
    body[data-theme-mode="dark"] {
      --ink: #F8EFE5;
      --mut: rgba(255, 255, 255, 0.78);
      --line: rgba(255, 255, 255, 0.14);
      --card-bg: rgba(18, 24, 38, 0.88);
    }
    body[data-theme-mode="dark"] .cert-topbar {
      background: rgba(18, 24, 38, 0.88);
      border-bottom-color: rgba(255, 255, 255, 0.14);
      color: #F8EFE5;
    }
    body[data-theme-mode="dark"] .cert-topbar a {
      color: #F8EFE5;
    }
    body[data-theme-mode="dark"] .cert-card {
      background: var(--card-bg, rgba(18, 24, 38, 0.88));
      border-color: rgba(255, 255, 255, 0.14);
      color: #F8EFE5;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }
    body[data-theme-mode="dark"] .cert-title-area h1 {
      color: var(--accent2, #FFE066);
    }
    body[data-theme-mode="dark"] .cert-recipient b {
      color: #F8EFE5;
    }
    .cert-container {
      max-width: 1000px;
      margin: 40px auto 80px;
      padding: 0 24px;
      width: 100%;
      flex: 1;
    }
    .cert-card {
      background: #FFFFFF;
      border: 1px solid rgba(27, 27, 27, 0.08);
      border-radius: var(--r-card, 40px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.06);
      overflow: hidden;
      padding: 44px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }
    .cert-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
      border-bottom: 1px solid rgba(27, 27, 27, 0.08);
      padding-bottom: 24px;
    }
    .cert-title-area h1 {
      margin: 0 0 8px;
      font-size: 32px;
      font-weight: 800;
      color: var(--ink);
      line-height: 1.2;
    }
    .cert-recipient {
      font-size: 16px;
      color: var(--mut);
    }
    .cert-recipient b {
      color: var(--ink);
    }
    .cert-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(15, 134, 161, 0.1);
      color: var(--accent);
      padding: 8px 18px;
      border-radius: var(--r-pill);
      font-size: 13.5px;
      font-weight: 700;
    }
    .cert-preview-wrapper {
      width: 100%;
      background: #F8EFE5;
      border-radius: 24px;
      border: 1.5px solid rgba(27, 27, 27, 0.06);
      overflow: hidden;
      display: grid;
      place-items: center;
      padding: 20px;
      min-height: 400px;
    }
    .cert-img-view {
      max-width: 100%;
      max-height: 720px;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.12);
      cursor: zoom-in;
      transition: transform 0.3s ease;
    }
    .cert-img-view:hover {
      transform: scale(1.01);
    }
    .cert-footer-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      color: var(--mut);
      font-size: 14px;
    }
    @media (max-width: 760px) {
      .cert-card { padding: 24px; border-radius: 28px; }
      .cert-title-area h1 { font-size: 24px; }
      .cert-topbar { padding: 12px 20px; }
    }
  </style>
</head>
<body class="cert-page">

  <header class="cert-topbar">
    <a href="index.html#achievements" class="btn btn-ghost btn-sm" id="backBtn">← Back to Portfolio</a>
    <div class="mono" style="font-weight:700; font-size:14px; color:var(--accent);">CREDENTIAL VERIFICATION</div>
    <button type="button" class="btn btn-primary btn-sm" onclick="window.print()">🖨️ Print / Save</button>
  </header>

  <main class="cert-container">
    <div class="cert-card">
      <div class="cert-head">
        <div class="cert-title-area">
          <h1 id="certName">Achievement Certificate</h1>
          <div class="cert-recipient">Awarded to: <b id="recipientName">Alex Stone</b></div>
        </div>
        <div class="cert-badge">
          <span>✓</span> Verified Credential
        </div>
      </div>

      <div class="cert-preview-wrapper" id="certPreviewWrapper">
        <img id="certImage" class="cert-img-view" alt="Certificate" src="" />
      </div>

      <div class="cert-footer-meta">
        <div id="certOrg">Official Record</div>
        <div class="mono muted" id="certId">ID: Verified-Credential</div>
      </div>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script>
    (async function() {
      const D = window.bpData.loadData();
      if (window.bpData.resolveMedia) {
        await window.bpData.resolveMedia(D);
      }

      // Apply theme
      const t = D.theme || {};
      const r = document.documentElement.style;
      const accent = t.accent || "#0F86A1";
      r.setProperty("--accent", accent);
      r.setProperty("--bg", t.bg || "#F8EFE5");
      r.setProperty("--accent2", t.accent2 || "#EBC7B5");

      function isDarkHex(hex) {
        if (!hex || typeof hex !== "string" || !hex.startsWith("#")) return false;
        let c = hex.replace("#", "");
        if (c.length === 3) c = c.split("").map(x => x + x).join("");
        const n = parseInt(c, 16);
        const red = (n >> 16) & 255, green = (n >> 8) & 255, blue = n & 255;
        const lum = (0.299 * red + 0.587 * green + 0.114 * blue) / 255;
        return lum < 0.48;
      }
      const isDark = t.themeMode === "dark" || isDarkHex(t.bg) || t.isDark === true;
      document.body.dataset.themeMode = isDark ? "dark" : "light";

      // Dynamic favicon from brand logo
      const o = D.owner || {};
      const logo = o.logo;
      function setFaviconLink(href, type) {
        const existing = document.querySelectorAll("link[rel*='icon']");
        existing.forEach(el => el.remove());
        const link = document.createElement("link");
        link.id = "siteFavicon";
        link.rel = "icon";
        link.type = type || "image/png";
        link.href = href;
        document.head.appendChild(link);
      }

      if (!logo || typeof logo !== "string" || !logo.trim() || logo.startsWith("idb:")) {
        const acc = encodeURIComponent(t.accent || "#0F86A1");
        const acc2 = encodeURIComponent(t.accent2 || "#5AD1FF");
        setFaviconLink("data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='" + acc + "'/%3E%3Ccircle cx='16' cy='16' r='5.5' fill='" + acc2 + "'/%3E%3C/svg%3E", "image/svg+xml");
      } else {
        const clean = logo.trim();
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => {
          try {
            const cv = document.createElement("canvas");
            cv.width = 64; cv.height = 64;
            const ctx = cv.getContext("2d");
            ctx.beginPath();
            ctx.arc(32, 32, 31, 0, Math.PI * 2);
            ctx.closePath();
            ctx.clip();
            ctx.drawImage(img, 0, 0, 64, 64);
            setFaviconLink(cv.toDataURL("image/png"), "image/png");
          } catch (e) {
            setFaviconLink(clean, clean.startsWith("data:image/gif") ? "image/gif" : "image/png");
          }
        };
        img.onerror = () => setFaviconLink(clean, "image/x-icon");
        img.src = clean;
      }

      document.getElementById("recipientName").textContent = (D.owner && D.owner.name) || "Alex Stone";

      const params = new URLSearchParams(window.location.search);
      const certIdx = parseInt(params.get("id"), 10);
      const achList = D.achievements || [];
      const item = (!isNaN(certIdx) && achList[certIdx]) ? achList[certIdx] : achList.find(a => !!a.cert);

      if (item) {
        document.getElementById("certName").textContent = item.name || "Achievement Certificate";
        document.title = (item.name || "Certificate") + " - " + ((D.owner && D.owner.name) || "Alex Stone");
        const img = document.getElementById("certImage");
        if (item.cert) {
          img.src = item.cert;
        } else {
          document.getElementById("certPreviewWrapper").innerHTML = '<div style="text-align:center; padding:40px; color:var(--mut);">No digital certificate uploaded for this entry.</div>';
        }
        document.getElementById("certId").textContent = "REF: ACH-" + (isNaN(certIdx) ? "01" : String(certIdx + 1).padStart(2, "0"));
      }
    })();
  </script>
</body>
</html>
