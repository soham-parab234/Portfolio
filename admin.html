<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Owner Dashboard - Schematic</title>
  <link rel="icon" id="siteFavicon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230F86A1'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23EBC7B5'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body class="admin-body">

  <!-- ============ AUTH GATE ============ -->
  <div id="adminAuth" class="auth-gate">
    <div class="auth-card">
      <div class="auth-brand mono">Owner · Admin</div>
      <h1>Owner Dashboard</h1>
      <p id="authSub" class="auth-sub">Enter your passcode to manage the portfolio.</p>
      <form id="authForm" class="auth-form">
        <div class="pass-wrap">
          <input id="authPass" type="password" autocomplete="current-password" placeholder="Passcode" />
          <button type="button" class="pass-toggle" id="authPassToggle" aria-label="Toggle password visibility">
            <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div id="authMsg" class="auth-error"></div>
        <button type="submit" class="btn btn-primary btn-block" id="authSubmit">Unlock →</button>
      </form>
      <a class="auth-back" href="index.html">← Back to Site</a>
    </div>
  </div>

  <!-- ============ EDITOR ============ -->
  <div id="editorRoot" class="editor" style="display:none">
    <header class="adminbar">
      <div class="adminbar-brand">
        <span>Owner Dashboard</span>
        <span class="adminbar-sub mono">Schematic</span>
      </div>
      <div class="adminbar-actions">
        <span id="changedInd" class="changed-ind"></span>
        <button id="resetBtn" class="btn btn-ghost btn-sm">Reset</button>
        <button id="saveBtn" class="btn btn-primary btn-sm">💾 Save changes</button>
        <button id="logoutBtn" class="btn btn-ghost btn-sm">Log out</button>
      </div>
    </header>

    <div class="editor-body">
      <aside class="editor-nav">
        <div id="navTabs" class="nav-tabs"></div>
      </aside>
      <main id="editorContent" class="editor-content"></main>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <!-- SECTION PREVIEW MODAL -->
  <div id="previewModal" class="preview-modal">
    <div class="preview-modal-card">
      <div class="preview-modal-head">
        <span>Section Preview</span>
        <button id="previewModalClose" class="mini-btn" aria-label="Close">✕</button>
      </div>
      <div id="previewModalBody" class="preview-modal-body"></div>
    </div>
  </div>

  <!-- ============ INTERACTIVE ADMIN LOADER ============ -->
  <div id="adminLoader" class="admin-loader-overlay" aria-live="polite">
    <div class="admin-loader-spinner"></div>
    <h3 class="admin-loader-title" id="adminLoaderTitle">Applying changes...</h3>
    <p class="admin-loader-sub" id="adminLoaderSub">Please wait while content is updated.</p>
  </div>

  <script src="js/data.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/palette.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
